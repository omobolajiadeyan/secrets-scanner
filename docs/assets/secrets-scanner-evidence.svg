<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Secrets Scanner evidence run</title>
  <desc id="desc">Evidence graphic for Secrets Scanner showing one file scanned, two redacted findings, one critical and one high severity.</desc>
  <rect width="1440" height="760" fill="#f8fafc"/>
  <text x="120" y="104" fill="#111827" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">Secrets Scanner evidence run</text>
  <text x="120" y="148" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Fake credential-shaped samples only. Matched values are redacted before export.</text>
  <rect x="120" y="200" width="1200" height="400" rx="24" fill="#0f172a"/>
  <g font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="24">
    <text x="180" y="280" fill="#38bdf8">python scanner.py sample/ --output web/sample-report.json</text>
    <text x="180" y="352" fill="#e5e7eb">Files scanned : 1</text>
    <text x="180" y="396" fill="#e5e7eb">Findings      : 2</text>
    <text x="180" y="440" fill="#fb7185">Critical      : 1 database connection string</text>
    <text x="180" y="484" fill="#fdba74">High          : 1 generic API key</text>
    <text x="180" y="548" fill="#86efac">JSON + SARIF exports contain redacted context only</text>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800">
    <rect x="120" y="640" width="210" height="44" rx="22" fill="#fee2e2" stroke="#ef4444"/>
    <text x="225" y="668" fill="#991b1b" text-anchor="middle">Critical fails CI</text>
    <rect x="352" y="640" width="210" height="44" rx="22" fill="#dcfce7" stroke="#22c55e"/>
    <text x="457" y="668" fill="#166534" text-anchor="middle">Redacted output</text>
    <rect x="584" y="640" width="186" height="44" rx="22" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="677" y="668" fill="#1d4ed8" text-anchor="middle">SARIF 2.1.0</text>
  </g>
</svg>
